하지만 작품마다 비정규직으로 참여해야 하는 환경에서, 안정된 자리에서 제가 진심으로 즐기는 콘텐츠를 만들고 싶다는 마음이 커졌습니다. 제 삶을 돌아보니 가장 오래 몰입한 콘텐츠는 패키지 게임이었습니다. 게임은 제게 새로운 세계 속 인물이 되어 그 세계를 직접 겪어 보게 하는 작품이었고, 그래서 저도 다른 사람들이 빠져들 수 있는 게임을 만들고 싶어졌습니다.

게임 기획 학원 과정에서 4개 프로젝트에 참여하며 기획은 감각만으로 하는 일이 아니라는 것을 배웠습니다. 기획 의도를 논리적인 근거와 함께 문서로 전달하고, 실제 플레이 데이터로 검증해야 한다는 것입니다. 마지막 프로젝트인 [다녀가용!]에서는 제가 쓴 기획서가 데이터 테이블과 빌드로 구현되고, 테스트 결과에 따라 다시 고쳐지는 과정을 끝까지 경험했습니다. 이제는 그 과정을 실제 개발 현장에서 반복하며, 유저가 계속 플레이하고 싶어지는 게임을 만드는 기획자로 일하고 싶어 지원했습니다.`},{title:`어디서든 적응하고, 근거로 설득하고, 직접 검증합니다`,body:`① 어디에서든 적응하고 협업하는 힘
3년 동안 7편의 영화, 드라마 현장에서 매번 새로운 팀과 일했습니다. 촬영 일정과 역할이 계속 바뀌는 환경에서 빠르게 팀의 방식을 파악하고 제 자리를 찾는 법을 익혔습니다. 게임 개발도 기획, 아트, 프로그래밍이 각자의 언어로 일하는 협업 작업인 만큼, 직군 사이에서 기획 의도가 끝까지 전달되도록 조율하는 데 이 경험을 쓰겠습니다.

② 개인 감각을 객관적인 근거로 바꾸는 습관
[Comstock] 프로젝트에서 처음에는 제 플레이 경험만으로 팀원을 설득하려다 막혔습니다. 같은 장르 유저의 리뷰와 플레이 영상을 분석해 "유저는 자기 유능감과 성취감 때문에 반복 플레이한다"는 근거를 세우자 팀이 납득했습니다. 입사 후에도 기획안을 낼 때 데이터, 유저 반응, 레퍼런스를 함께 제시해 팀이 빠르게 판단할 수 있도록 하겠습니다.

③ 기획을 직접 검증하는 실행력
Unity로 프리팹 배치, UI 배치, 빌드를 직접 해 봤고, AI 도구로 레퍼런스 이미지와 웹 프로토타입을 만들어 기획을 미리 검증해 왔습니다. 문서로만 끝내지 않고 빠르게 만들어 보고 확인하는 방식으로 개발 비용을 줄이는 데 기여하겠습니다.`},{title:`네 번의 프로젝트, 리소스에서 기획과 개발까지`,body:`[다녀가용!] 인크리멘탈 러너 | 2026.09 ~ 11 | 5인
- 역할: 패시브 스킬 기획, 레벨 디자인, 데이터 테이블 설계, 개발
- 자동으로 발동하는 패시브 스킬 6종을 기획하고, 8개 테마 16스테이지가 하나의 길로 이어지는 레벨 구조를 설계했습니다.
- 게임 전체 데이터를 38개 시트의 데이터 테이블로 정리했습니다.
- Unity로 개발해 itch.io 웹 버전과 Windows CBT/OBT 빌드를 출시했고, 플레이 지표를 바탕으로 수치를 조정했습니다.

[Comstock] 뱀서라이크 액션 슈팅 | 2026.07 ~ 09 (8주) | 5인
- 역할: 세부 콘텐츠 기획, 리소스 제작, 출시 후 마케팅
- 플레이 방식을 바꾸는 머리 파츠 9종과 캐릭터 특성을 바꾸는 다리 파츠 3종을 기획했습니다. 유저가 직접 빌드를 짜며 반복 플레이하도록 의도했고, 구현까지 완료했습니다.
- AI 도구로 로봇, 적, 드롭 아이템, 무기 등 게임 전반의 리소스를 제작했습니다.
- 출시 후 틱톡 라이트 홍보 계정을 운영했습니다.

[까미 스트리밍] 방치형 클리커 | 2026.07 (약 21일) | 2인
- 역할: 콘텐츠 기획, 비주얼 가이드 작성, BGM 제작, QA
- 첫 프로젝트 이후, 기획을 직접 담당하게 되었습니다.
- 콘텐츠 기획과 비주얼 가이드를 작성했고, AI 도구를 활용하여 메인 테마와 스테이지별 BGM을 작곡했습니다.

[크런치] 비주얼노벨 | 2026.06 (약 14일) | 5인
- 역할: 리소스 제작 (캐릭터, 배경)
- 게임 기획 과정의 첫 프로젝트에서 AI 도구를 통해 게임의 캐릭터와 배경 리소스를 담당했습니다.`},{title:`내 경험이 아닌 근거로 설득하다`,body:`[Comstock] 아이데이션 초기에 팀원들과 기획 방향이 계속 엇갈렸습니다. 저는 직접 플레이해 본 경험을 근거로 "이런 요소가 재미있다"고 설명했지만, 서로 다른 게임을 즐겨 온 팀원들에게는 와닿지 않았습니다. 8주라는 짧은 기간 동안 기획이 진전되지 않자 "왜 내 생각을 이해하지 못할까" 하는 답답함도 들었습니다.

그러다 문제를 팀원이 아니라 제 전달 방식에서 찾기로 했습니다. 같은 장르 게임의 유저 리뷰와 플레이 영상을 모아 분석했고, 유저들이 자기 유능감과 성취감에서 재미를 느껴 반복 플레이한다는 공통점을 찾았습니다. 이 근거를 바탕으로 "다양한 파츠 조합으로 유저가 직접 빌드를 짜게 하자"는 방향을 다시 제안했고, 팀원들도 동의해 머리 9종, 다리 3종 파츠 기획과 구현까지 이어갈 수 있었습니다.

이 경험으로 "내 경험으로 설득하자"는 태도를 "근거로 소통하자"로 바꿨습니다. 영화 현장에서는 감성과 구두 설명으로 충분했지만, 게임 기획은 논리적인 문서와 근거가 있어야 팀이 함께 움직일 수 있다는 것을 배웠습니다.`},{title:`유저가 계속 플레이하는 이유를 지표로 답하는 기획자`,body:`입사 후에는 먼저 회사의 문서 체계와 개발 파이프라인을 빠르게 익혀, 제가 맡은 콘텐츠를 기획 의도부터 구현 검수까지 책임지는 기획자가 되고 싶습니다. 스스로를 "슬로우 스타터"라고 생각하는 만큼, 새로운 기술은 꾸준히 반복해서 익혀 확실하게 제 것으로 만들겠습니다.

업무에 익숙해진 뒤에는 라이브 데이터와 유저 반응을 분석해 근거 있는 개선안을 내는 기획자로 성장하고 싶습니다. 유저가 왜 계속 플레이하는지에 대해 감이 아닌 지표로 답할 수 있어야, 팀이 같은 방향으로 판단하고 더 나은 시스템과 콘텐츠를 만들 수 있다고 믿기 때문입니다.
